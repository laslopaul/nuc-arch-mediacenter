name: Ansible checks

on:
  pull_request:
    paths:
      - 'roles/**'
      - 'tasks/**'
      - 'tests/**'
      - 'scripts/**'
      - 'group_vars/**'
      - 'inventory/**'
      - '*.yml'
      - '*.cfg'
      - 'requirements*.txt'
      - '.ansible-lint'
      - '.github/workflows/ansible-lint.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install shared environment
        run: bash scripts/bootstrap.sh
      - name: Lint and syntax checks
        run: |
          .venv/venv/bin/ansible-lint
          .venv/venv/bin/ansible-playbook local.yml --syntax-check
          .venv/venv/bin/ansible-playbook purge.yml --syntax-check
      - name: Behavior and Compose checks
        run: |
          export PATH="$PWD/.venv/venv/bin:$PATH"
          python -m unittest discover -s tests -v
