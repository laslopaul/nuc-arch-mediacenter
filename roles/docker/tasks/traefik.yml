---
# code: language=ansible

- name: Add folders for Traefik files
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0755"
  vars:
    service_dir: "{{ docker_path }}/{{ docker_service_catalog.traefik.directory }}"
  loop: "{{ [service_dir] + docker_service_catalog.traefik.subdirectories | map('regex_replace', '^', service_dir ~ '/') | list }}"

- name: Set provisioner password permissions for the issuing user
  ansible.builtin.file:
    path: "{{ pki_path }}/admin.txt"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0600"

- name: Generate TLS cert for traefik
  become: true
  become_user: "{{ username }}"
  environment:
    STEPPATH: "{{ pki_path }}/step"
  ansible.builtin.command:
    chdir: "{{ docker_path }}/{{ docker_service_catalog['traefik'].directory }}/ssl"
    cmd: >
      step ca certificate "*.{{ domain }}" cert.crt cert.key --password-file={{ pki_path }}/admin.txt --provisioner admin
    creates: "{{ docker_path }}/{{ docker_service_catalog['traefik'].directory }}/ssl/cert.crt"

- name: Ensure certificate and private key belong to the renewal user
  ansible.builtin.file:
    path: "{{ docker_path }}/{{ docker_service_catalog.traefik.directory }}/ssl/{{ item }}"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "{{ '0600' if item == 'cert.key' else '0644' }}"
  loop: [cert.crt, cert.key]

- name: Copy traefik-cert-renewer.service to systemd folder
  ansible.builtin.template:
    src: traefik-cert-renewer.service.j2
    dest: /etc/systemd/system/traefik-cert-renewer.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Traefik certificate renewer

- name: Enable traefik-cert-renewer.service
  ansible.builtin.systemd:
    unit: traefik-cert-renewer.service
    daemon_reload: true
    state: started
    enabled: true

- name: Copy Traefik static config
  ansible.builtin.copy:
    src: traefik/traefik.yml
    dest: "{{ docker_path }}/{{ docker_service_catalog['traefik'].directory }}/traefik.yml"
    mode: "0644"
  register: traefik_static_config

# Default cert (Step CA) & shared middlewares; picked up without restart
- name: Copy Traefik TLS config
  ansible.builtin.copy:
    src: traefik/dynamic/tls.yml
    dest: "{{ docker_path }}/{{ docker_service_catalog['traefik'].directory }}/dynamic/tls.yml"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"

- name: Create Traefik route for the Let's Encrypt wildcard cert
  ansible.builtin.template:
    src: traefik-acme.yml.j2
    dest: "{{ docker_path }}/{{ docker_service_catalog['traefik'].directory }}/dynamic/acme.yml"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"

- name: Create Docker Compose file
  ansible.builtin.template:
    src: "{{ docker_service_catalog.traefik.template }}"
    dest: "{{ docker_path }}/{{ docker_service_catalog['traefik'].directory }}/docker-compose.yml"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"

- name: Launch Traefik service
  community.docker.docker_compose_v2:
    project_src: "{{ docker_path }}/{{ docker_service_catalog.traefik.directory }}"
    project_name: "{{ docker_service_catalog.traefik.project }}"
    # Static config is only read on startup
    recreate: "{{ 'always' if traefik_static_config.changed else 'auto' }}"
    remove_orphans: false
    pull: missing
    state: present
