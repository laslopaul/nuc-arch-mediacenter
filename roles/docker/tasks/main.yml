---
- name: Resolve managed user identity
  ansible.builtin.include_role:
    name: user_identity
    apply:
      tags: always
  tags: always

- name: Select Docker services
  ansible.builtin.set_fact:
    docker_selected: "{{ docker_services if docker_enabled | bool else [] }}"
  tags: always

- name: Validate Docker services
  ansible.builtin.import_tasks: validate.yml
  tags: always

- name: Install Docker
  ansible.builtin.import_tasks: install.yml
  when: docker_enabled | bool
  tags: docker-install

# Always visit the includes so --tags qb / vw etc. reach their children.
- name: Deploy selected Docker services in order
  ansible.builtin.include_tasks:
    file: deploy.yml
    apply:
      tags: "{{ docker_service_catalog[docker_service].tag }}"
  loop: "{{ docker_service_order | select('in', docker_selected) | list }}"
  loop_control:
    loop_var: docker_service
  tags: always

- name: Remove unselected Docker services
  ansible.builtin.import_tasks: remove.yml
  tags: docker-remove
