---
# code: language=ansible

docker_path: "{{ managed_user_home }}/docker"

timezone: "Europe/Minsk"

# Install Docker engine. When false, all services and Docker itself
# are removed (see purge options below).
docker_enabled: true

# Services to deploy. A service left out of the list is stopped and
# its containers & compose file are removed (see purge options below).
docker_services:
  - step-ca
  - traefik
  - qbittorrent
  - vaultwarden
  - plex
  - immich
  - syncthing

# Also delete images of removed services.
docker_purge_images: true
# Also uninstall packages of removed components (step-cli, and Docker
# itself when docker_enabled is false). Packages still required by
# something else are kept.
docker_purge_packages: true

# Deployment order is explicit; removal uses its reverse.
docker_service_order: [step-ca, traefik, qbittorrent, vaultwarden, plex, immich, syncthing]
docker_service_catalog:
  step-ca:
    directory: step
    project: step
    volumes: []
    subdirectories: [data]
    requires: []
    template: step-ca-compose.yml.j2
    tag: step-ca
  traefik:
    directory: traefik
    project: traefik
    volumes: []
    subdirectories: [ssl, dynamic, letsencrypt]
    requires: [step-ca]
    template: traefik-compose.yml.j2
    tag: traefik
  qbittorrent:
    directory: qb
    project: qb
    volumes: []
    subdirectories: [config]
    requires: [traefik]
    template: qbittorrent-compose.yml.j2
    tag: qb
  vaultwarden:
    directory: vw
    project: vw
    volumes: []
    subdirectories: [data]
    requires: [traefik]
    template: vaultwarden-compose.yml.j2
    tag: vw
  plex:
    directory: plex
    project: plex
    volumes: []
    subdirectories: [config]
    requires: []
    template: plex-compose.yml.j2
    tag: plex
  immich:
    directory: immich
    project: immich
    volumes: [immich_model-cache]
    subdirectories: [data, postgres]
    requires: [traefik]
    template: immich-compose.yml.j2
    tag: immich
  syncthing:
    directory: syncthing
    project: syncthing
    volumes: []
    subdirectories: [config, data, data/share1]
    requires: [traefik]
    template: syncthing-compose.yml.j2
    tag: syncthing

docker_step_ca_fingerprint: cb8e704102547f8a85f656a6419a5c7c3ae93a7ef5eda3bb1504f6a31acd8a9c

images:
  traefik: "traefik:v3.7.16"
  qbittorrent: "lscr.io/linuxserver/qbittorrent:5.3.0"
  vaultwarden: "vaultwarden/server:1.37.4"
  plex: "lscr.io/linuxserver/plex:1.43.5"
  step-ca: "smallstep/step-ca:0.30.2"
  syncthing: "lscr.io/linuxserver/syncthing:2.1.7"
  immich-server: "ghcr.io/immich-app/immich-server:v3.3.5"
  immich-ml: "ghcr.io/immich-app/immich-machine-learning:v3.3.5"
