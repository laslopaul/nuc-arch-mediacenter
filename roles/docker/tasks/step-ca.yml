---
# code: language=ansible

# step-ca container itself is deployed by service.yml

- name: Install step-cli
  community.general.pacman:
    name:
      - step-cli
    state: present
    update_cache: true

- name: Create symlink to step
  ansible.builtin.file:
    src: /usr/bin/step-cli
    dest: /usr/local/bin/step
    state: link

- name: Create managed PKI directory
  ansible.builtin.file:
    path: "{{ pki_path }}"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0700"

- name: Wait for Step CA to accept connections
  ansible.builtin.wait_for:
    host: "{{ domain }}"
    port: 9000
    timeout: 60
  when: not ansible_check_mode

- name: Bootstrap Step CA for the managed user
  become: true
  become_user: "{{ username }}"
  environment:
    STEPPATH: "{{ pki_path }}/step"
  ansible.builtin.command:
    argv:
      - step
      - ca
      - bootstrap
      - --ca-url
      - "https://{{ domain }}:9000"
      - --fingerprint
      - "{{ docker_step_ca_fingerprint }}"
    creates: "{{ pki_path }}/step/certs/root_ca.crt"
  register: docker_step_bootstrap
  retries: 5
  delay: 3
  until: docker_step_bootstrap is succeeded

- name: Install CA certificate in the system trust store
  ansible.builtin.copy:
    src: "{{ pki_path }}/step/certs/root_ca.crt"
    dest: /etc/ca-certificates/trust-source/anchors/nuc-step-ca.crt
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  notify: Update CA trust
