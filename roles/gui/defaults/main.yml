---
# code: language=ansible

# supported variants: i3, labwc and none (no desktop).
# The desktop not selected here gets removed (see purge options below).
desktop: labwc

# Apps to install & configure. An app left out of the list gets removed
# (see purge options below). To remove the GUI completely, set desktop
# to none and empty this list.
gui_components:
  - kodi
  - firefox
  - alacritty

# Also uninstall packages of removed desktops & apps.
# Packages still required by something else, or by a selected
# desktop / app, are kept.
gui_purge_packages: false

# packages of each desktop & app
gui_packages:
  i3:
    - i3-wm
    - xorg-xinit
    - xorg-xrandr
    - xorg-xset
    - xorg-server
    - ttf-hack
  labwc:
    - labwc
    - ttf-hack
  kodi:
    - kodi
  firefox:
    - firefox
  alacritty:
    - alacritty
    - ttf-hack

# config files & folders of each desktop & app, relative to user's home
gui_configs:
  i3:
    - .config/i3
    - .xinitrc
  labwc:
    - .config/labwc
  alacritty:
    - .config/alacritty

# user data of each app, relative to user's home
gui_userdata:
  kodi:
    - .kodi
  firefox:
    - .mozilla
    - .cache/mozilla

# Static files have their final mode on the initial copy.
gui_config_files:
  i3:
    - {path: .config/i3/i3-restart.sh, mode: "0755"}
  labwc:
    - {path: .config/labwc/environment, mode: "0644"}
    - {path: .config/labwc/menu.xml, mode: "0644"}
    - {path: .config/labwc/rc.xml, mode: "0644"}
  alacritty:
    - {path: .config/alacritty/alacritty.toml, mode: "0644"}
