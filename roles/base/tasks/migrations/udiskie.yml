---
# code: language=ansible

- name: Check for udiskie.service of user
  ansible.builtin.stat:
    path: "{{ managed_user_home }}/.config/systemd/user/udiskie.service"
  register: udiskie_unit

- name: Disable udiskie service for user
  become: true
  become_user: "{{ username }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ managed_user_uid }}"
  ansible.builtin.systemd:
    scope: user
    enabled: false
    name: udiskie
    state: stopped
  when: udiskie_unit.stat.exists

- name: Remove udiskie config and user service
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ managed_user_home }}/.config/systemd/user/udiskie.service"
    - "{{ managed_user_home }}/.config/udiskie"

- name: Reload systemd for user
  become: true
  become_user: "{{ username }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ managed_user_uid }}"
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
  when: udiskie_unit.stat.exists

- name: Remove Polkit rule for removable drive operations
  ansible.builtin.file:
    path: /etc/polkit-1/rules.d/10-udiskie.rules
    state: absent
  notify: Restart polkit

- name: Remove unused component packages
  ansible.builtin.import_role:
    name: package_cleanup
  vars:
    package_cleanup_candidates: ['udiskie', 'udisks2']
  when: base_purge_packages | bool
