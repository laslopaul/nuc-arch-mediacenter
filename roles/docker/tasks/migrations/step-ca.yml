---
# Retired service cleanup. Preserve CA keys and other data for manual recovery.
- name: Check for the Docker socket
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: docker_legacy_socket

- name: Remove the retired Step CA container
  community.docker.docker_container:
    name: step-ca
    state: absent
  when: docker_legacy_socket.stat.exists

- name: Check for the retired certificate renewal unit
  ansible.builtin.stat:
    path: /etc/systemd/system/traefik-cert-renewer.service
  register: docker_legacy_renewer

- name: Stop and disable retired certificate renewal
  ansible.builtin.systemd:
    name: traefik-cert-renewer.service
    state: stopped
    enabled: false
  when: docker_legacy_renewer.stat.exists

- name: Remove the retired certificate renewal unit
  ansible.builtin.file:
    path: /etc/systemd/system/traefik-cert-renewer.service
    state: absent
  notify: Reload Docker systemd units

- name: Remove retired CA deployment and proxy configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ docker_path }}/step/docker-compose.yml"
    - "{{ docker_path }}/{{ docker_service_catalog.traefik.directory }}/dynamic/tls.yml"
    - /usr/local/bin/step

- name: Check for the retained CA certificate
  ansible.builtin.stat:
    path: "{{ docker_path }}/step/data/certs/root_ca.crt"
  register: docker_legacy_ca

- name: Read the retained CA fingerprint
  ansible.builtin.command:
    argv: [openssl, x509, -in, "{{ docker_legacy_ca.stat.path }}", -noout, -fingerprint, -sha256]
  register: docker_legacy_ca_fingerprint
  changed_when: false
  check_mode: false
  when: docker_legacy_ca.stat.exists

- name: Identify the retired CA
  ansible.builtin.set_fact:
    # The fallback identifies this repo's original CA if its retained data is gone.
    docker_legacy_ca_digest: >-
      {{ docker_legacy_ca_fingerprint.stdout
         | default('cb8e704102547f8a85f656a6419a5c7c3ae93a7ef5eda3bb1504f6a31acd8a9c')
         | regex_replace('^.*=', '') | replace(':', '') | lower | trim }}

- name: Find the local anchors created by the retired CA setup
  ansible.builtin.find:
    paths: /etc/ca-certificates/trust-source/anchors
    patterns: [nuc-step-ca.crt, 'nuc-server.lan_*.crt']
    file_type: file
  register: docker_legacy_ca_anchors

- name: Read local anchor fingerprints
  ansible.builtin.command:
    argv: [openssl, x509, -in, "{{ item.path }}", -noout, -fingerprint, -sha256]
  loop: "{{ docker_legacy_ca_anchors.files }}"
  loop_control:
    label: "{{ item.path }}"
  register: docker_legacy_anchor_fingerprints
  changed_when: false
  check_mode: false

# File-backed p11-kit anchors are read-only through `trust anchor --remove`.
# Remove matching source files and let update-ca-trust regenerate the bundles.
- name: Remove matching retired CA anchor files
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: absent
  loop: "{{ docker_legacy_anchor_fingerprints.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: >-
    (item.stdout | regex_replace('^.*=', '') | replace(':', '') | lower | trim)
    == docker_legacy_ca_digest
  notify: Update CA trust

- name: Remove the obsolete CA CLI when no other package needs it
  ansible.builtin.import_role:
    name: package_cleanup
  vars:
    package_cleanup_candidates: [step-cli]
  when: docker_purge_packages | bool
