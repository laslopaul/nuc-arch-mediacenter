---
# code: language=ansible

- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    state: restarted

- name: Restart polkit
  ansible.builtin.systemd:
    name: polkit
    state: restarted

- name: Refresh pacman mirrorlist
  ansible.builtin.systemd:
    name: reflector.service
    state: restarted

- name: Reload automount udev rules
  ansible.builtin.command: udevadm control --reload-rules
  changed_when: true
