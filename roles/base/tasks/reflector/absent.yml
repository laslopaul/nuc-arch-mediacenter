---
# code: language=ansible

- name: Gather installed packages
  ansible.builtin.package_facts:

- name: Disable reflector timer
  ansible.builtin.systemd:
    name: reflector.timer
    state: stopped
    enabled: false
  when: "'reflector' in ansible_facts.packages"

- name: Remove reflector config
  ansible.builtin.file:
    path: /etc/xdg/reflector/reflector.conf
    state: absent

- name: Remove unused component packages
  ansible.builtin.import_role:
    name: package_cleanup
  vars:
    package_cleanup_candidates: ['reflector']
  when: base_purge_packages | bool
