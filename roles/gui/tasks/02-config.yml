---
# code: language=ansible

- name: Create selected configuration directories
  ansible.builtin.file:
    path: "{{ managed_user_home }}/{{ item }}"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0755"
  loop: "{{ gui_selected | map('extract', gui_configs) | select('defined') | flatten | reject('equalto', '.xinitrc') | list }}"

- name: Copy static config files with their final permissions
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ managed_user_home }}/{{ item.path }}"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "{{ item.mode }}"
  loop: "{{ gui_selected | map('extract', gui_config_files) | select('defined') | flatten }}"

- name: Render selected desktop startup configuration
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ managed_user_home }}/{{ item }}"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "{{ '0644' if item == '.config/i3/config' else '0755' }}"
  loop: "{{ ['.config/i3/config', '.xinitrc'] if desktop == 'i3' else ['.config/labwc/autostart'] if desktop == 'labwc' else [] }}"

- name: Copy .bash_profile
  ansible.builtin.template:
    src: .bash_profile.j2
    dest: "{{ managed_user_home }}/.bash_profile"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0644'
