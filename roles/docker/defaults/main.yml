---
# code: language=ansible

docker_path: "{{ managed_user_home }}/docker"

timezone: "Europe/Minsk"

# Install Docker engine. When false, all services and Docker itself
# are removed (see purge options below).
docker_enabled: true

# Services to deploy. A service left out of the list is stopped and
# its containers & compose file are removed (see purge options below).
docker_services:
  - traefik
  - qbittorrent
  - vaultwarden
  - jellyfin
  - immich
  - syncthing

# Also delete images of removed services.
docker_purge_images: true
# Also uninstall Docker packages when docker_enabled is false, and
# obsolete migration helpers. Packages required by other packages are kept.
docker_purge_packages: true

# Deployment order is explicit; removal uses its reverse.
docker_service_order: [traefik, qbittorrent, vaultwarden, jellyfin, immich, syncthing]
docker_service_catalog:
  traefik:
    directory: traefik
    project: traefik
    volumes: []
    subdirectories: [dynamic, letsencrypt]
    requires: []
    template: traefik-compose.yml.j2
    tag: traefik
  qbittorrent:
    directory: qb
    project: qb
    volumes: []
    subdirectories: [config]
    requires: [traefik]
    template: qbittorrent-compose.yml.j2
    tag: qb
  vaultwarden:
    directory: vw
    project: vw
    volumes: []
    subdirectories: [data]
    requires: [traefik]
    template: vaultwarden-compose.yml.j2
    tag: vw
  jellyfin:
    directory: jellyfin
    project: jellyfin
    volumes: []
    subdirectories: [config]
    requires: [traefik]
    template: jellyfin-compose.yml.j2
    tag: jellyfin
  immich:
    directory: immich
    project: immich
    volumes: [immich_model-cache]
    subdirectories: [data, postgres]
    requires: [traefik]
    template: immich-compose.yml.j2
    tag: immich
  syncthing:
    directory: syncthing
    project: syncthing
    volumes: []
    subdirectories: [config, data, data/share1]
    requires: [traefik]
    template: syncthing-compose.yml.j2
    tag: syncthing

images:
  traefik: "traefik:v3.8.0"
  qbittorrent: "lscr.io/linuxserver/qbittorrent:5.3.1"
  vaultwarden: "vaultwarden/server:1.37.5"
  jellyfin: "lscr.io/linuxserver/jellyfin:12.4ubu2604-ls60"
  syncthing: "lscr.io/linuxserver/syncthing:2.1.7"
  immich-server: "ghcr.io/immich-app/immich-server:v3.4.2"
  immich-ml: "ghcr.io/immich-app/immich-machine-learning:v3.4.2"
