---
# code: language=ansible

- name: Gather installed packages
  ansible.builtin.package_facts:

- name: Disable dnsmasq service
  ansible.builtin.systemd:
    name: dnsmasq
    state: stopped
    enabled: false
  when: "'dnsmasq' in ansible_facts.packages"

- name: Remove dnsmasq config
  ansible.builtin.file:
    path: /etc/dnsmasq.conf
    state: absent

- name: Remove unused component packages
  ansible.builtin.import_role:
    name: package_cleanup
  vars:
    package_cleanup_candidates: ['dnsmasq']
  when: base_purge_packages | bool
