---
# code: language=ansible

- name: Gather installed packages
  ansible.builtin.package_facts:

- name: Disable dnsmasq service
  ansible.builtin.systemd:
    name: dnsmasq
    state: stopped
    enabled: false
  when: "'dnsmasq' in ansible_facts.packages"

- name: Remove dnsmasq config
  ansible.builtin.file:
    path: /etc/dnsmasq.conf
    state: absent

- name: Uninstall dnsmasq if not required by others
  ansible.builtin.shell: |
    if pacman -Qqt dnsmasq >/dev/null 2>&1; then
      pacman -R --noconfirm dnsmasq && echo "removed dnsmasq"
    fi
  register: dnsmasq_purge
  changed_when: "'removed' in dnsmasq_purge.stdout"
  when: base_purge_packages | bool
