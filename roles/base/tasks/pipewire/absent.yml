---
# code: language=ansible

- name: Gather installed packages
  ansible.builtin.package_facts:

- name: Disable PipeWire services for user
  become: true
  become_user: "{{ username }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ managed_user_uid }}"
  ansible.builtin.systemd:
    scope: user
    enabled: false
    name: "{{ item.unit }}"
    state: stopped
  loop:
    - { unit: 'wireplumber.service', pkg: 'wireplumber' }
    - { unit: 'pipewire-pulse.socket', pkg: 'pipewire-pulse' }
    - { unit: 'pipewire-pulse.service', pkg: 'pipewire-pulse' }
    - { unit: 'pipewire.socket', pkg: 'pipewire' }
    - { unit: 'pipewire.service', pkg: 'pipewire' }
  when: item.pkg in ansible_facts.packages

- name: Disable rtkit daemon
  ansible.builtin.systemd:
    name: rtkit-daemon
    state: stopped
    enabled: false
  when: "'rtkit' in ansible_facts.packages"

- name: Remove unused component packages
  ansible.builtin.import_role:
    name: package_cleanup
  vars:
    package_cleanup_candidates: ['wireplumber', 'pipewire-pulse', 'pipewire-alsa', 'pipewire', 'alsa-utils', 'rtkit']
  when: base_purge_packages | bool
